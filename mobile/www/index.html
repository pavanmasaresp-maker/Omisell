<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1B2559" />
<title>OmniSell</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="hidden">
  <div class="login-hero">
    <div class="mark"></div>
    <h1>OmniSell</h1>
    <p>Ek baar likho. Har jagah bechho.</p>
  </div>
  <div class="login-card">
    <h2>Welcome</h2>
    <div class="small" style="margin-bottom:12px">Apne Google account se sign in karo. Naya account apne aap ban jata hai.</div>
    <div id="login-err" class="banner err hidden"></div>
    <button class="btn google" id="google-btn" onclick="googleLogin()"><svg viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span>Continue with Google</span></button>
    <details class="alt">
      <summary>Admin login (username aur password)</summary>
      <form onsubmit="doLogin(); return false;">
        <label class="lbl" for="login-username">Username</label>
        <input id="login-username" autocapitalize="none" autocomplete="username" />
        <label class="lbl" for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" />
        <button class="btn quiet" id="login-btn" type="submit">Sign in</button>
      </form>
    </details>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="hidden">
  <header class="topbar">
    <button id="back-btn" class="back hidden" onclick="goBack()" aria-label="Back">&#8249;</button>
    <div class="titles">
      <h1 id="topbar-title">Home</h1>
      <div id="topbar-sub" class="sub"></div>
    </div>
  </header>
  <main id="content"></main>
  <nav class="tabbar">
    <button class="tab" data-tab="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="tab" data-tab="products" onclick="go('products')"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4V11M21 7v10l-9 4"/></svg><span>Products</span></button>
    <button class="tab" data-tab="stock" onclick="go('stock')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stock</span></button>
    <button class="tab" data-tab="orders" onclick="go('orders')"><svg viewBox="0 0 24 24"><path d="M6 3h12l2 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7zM4 7h16M9 11h6"/></svg><span>Orders</span></button>
    <button class="tab" data-tab="more" onclick="go('more')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
  </nav>
</div>
<div id="toast" class="toast hidden"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
